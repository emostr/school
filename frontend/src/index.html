<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>edway.space</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Тема ставится до отрисовки, иначе светлая страница мигнёт тёмной.
    try {
      var theme = localStorage.getItem('es-theme');
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <es-root>
    <div style="position:fixed;inset:0;display:grid;place-items:center;font:300 28px 'Open Sans',sans-serif;color:#888">edway.space</div>
  </es-root>
</body>
</html>
